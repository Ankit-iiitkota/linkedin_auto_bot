<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applied Jobs History</title>
<style>
  :root {
    --bg: #FAFAF9;
    --surface: #FFFFFF;
    --border: #E7E5E4;
    --text: #1C1917;
    --text-muted: #78716C;
    --text-faint: #A8A29E;
    --accent: #4F46E5;
    --accent-soft: #EEF2FF;
    --success: #16A34A;
    --success-soft: #F0FDF4;
    --row-hover: #F5F5F4;
    --shadow: 0 1px 2px rgba(28, 25, 21, 0.04), 0 1px 3px rgba(28, 25, 21, 0.06);
    --radius: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181B;
      --surface: #212023;
      --border: #33322F;
      --text: #F2F1EF;
      --text-muted: #A6A29B;
      --text-faint: #6E6A63;
      --accent: #818CF8;
      --accent-soft: #2A2A4A;
      --success: #4ADE80;
      --success-soft: #14251A;
      --row-hover: #29282A;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #18181B; --surface: #212023; --border: #33322F; --text: #F2F1EF;
    --text-muted: #A6A29B; --text-faint: #6E6A63; --accent: #818CF8;
    --accent-soft: #2A2A4A; --success: #4ADE80; --success-soft: #14251A;
    --row-hover: #29282A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.4);
  }
  :root[data-theme="light"] {
    --bg: #FAFAF9; --surface: #FFFFFF; --border: #E7E5E4; --text: #1C1917;
    --text-muted: #78716C; --text-faint: #A8A29E; --accent: #4F46E5;
    --accent-soft: #EEF2FF; --success: #16A34A; --success-soft: #F0FDF4;
    --row-hover: #F5F5F4; --shadow: 0 1px 2px rgba(28,25,21,.04), 0 1px 3px rgba(28,25,21,.06);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 32px 24px 64px; }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header.page-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.875rem;
    margin-top: 4px;
  }

  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.8125rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .refresh-btn:active { transform: scale(0.97); }
  .refresh-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .refresh-btn svg { width: 15px; height: 15px; }
  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .stat-label {
    font-size: 0.6875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .stat-value {
    font-size: 1.625rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .stat-value.accent { color: var(--accent); }
  .stat-value.success { color: var(--success); }

  .table-shell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; min-width: 720px; }

  thead th {
    text-align: left;
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    background: var(--row-hover);
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th.sl-col { width: 44px; text-align: center; }
  th.applied-col { width: 90px; text-align: center; }

  .th-flex { display: inline-flex; align-items: center; gap: 4px; }

  .sort-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--text-faint);
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sort-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .sort-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sort-btn svg { width: 13px; height: 13px; transition: transform 0.15s ease; }
  .sort-btn[data-order="desc"] svg { transform: rotate(180deg); }

  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s ease; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--row-hover); }

  td { padding: 12px 16px; vertical-align: middle; color: var(--text); }
  td.sl-col { text-align: center; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  td.company-cell { color: var(--text-muted); }

  .job-link {
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .job-link:hover { color: var(--accent); }
  .job-link svg { width: 12px; height: 12px; opacity: 0; transition: opacity 0.15s ease; flex-shrink: 0; }
  .job-link:hover svg { opacity: 1; }

  .hr-link { color: var(--accent); text-decoration: none; font-weight: 500; }
  .hr-link:hover { text-decoration: underline; }
  .muted { color: var(--text-faint); }

  .ext-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 0.8125rem;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 7px;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .ext-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .ext-btn svg { width: 12px; height: 12px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--success-soft);
    color: var(--success);
  }
  .pill svg { width: 11px; height: 11px; }

  .applied-col svg.check { width: 16px; height: 16px; color: var(--success); }
  .applied-col .dash { color: var(--text-faint); }

  .empty-state {
    padding: 64px 24px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-state svg { width: 40px; height: 40px; color: var(--text-faint); margin-bottom: 12px; }
  .empty-state p { margin: 0; font-size: 0.9375rem; }
  .empty-state .hint { font-size: 0.8125rem; margin-top: 4px; color: var(--text-faint); }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <div>
        <h1>Applied Jobs History</h1>
        <div class="subtitle" id="subtitle">Loading applications&hellip;</div>
      </div>
      <button class="refresh-btn" id="refreshBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
    </header>

    <div class="stat-row" id="statRow" hidden>
      <div class="stat-card">
        <div class="stat-label">Total Applications</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Easy Applied</div>
        <div class="stat-value success" id="statEasy">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">External Applications</div>
        <div class="stat-value accent" id="statExternal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Companies</div>
        <div class="stat-value" id="statCompanies">0</div>
      </div>
    </div>

    <div class="table-shell">
      <div class="table-scroll">
        <table id="jobsTable">
          <thead>
            <tr>
              <th class="sl-col">#</th>
              <th>Job Title</th>
              <th>Company</th>
              <th>HR Contact</th>
              <th>
                <span class="th-flex">
                  Application
                  <button class="sort-btn" id="sortBtn" type="button" data-order="asc" aria-label="Sort by application type">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                  </button>
                </span>
              </th>
              <th class="applied-col">Applied</th>
            </tr>
          </thead>
          <tbody id="jobsBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v0M16 4v0"/></svg>
        <p id="emptyTitle">No applications yet</p>
        <p class="hint" id="emptyHint">Run the bot to start applying, then refresh this page.</p>
      </div>
    </div>
  </div>

<script>
  const ICONS = {
    check: '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
    pillCheck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
  };

  let sortOrder = 'asc';
  let jobsData = [];

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  }

  function renderRow(job, index) {
    const tr = document.createElement('tr');

    const hasHR = job.HR_Name && job.HR_Name !== 'Unknown';
    const isEasyApplied = job.External_Job_link === 'Easy Applied';
    const hasExternal = !isEasyApplied && job.External_Job_link;
    const wasApplied = isEasyApplied || (hasExternal && job.Date_Applied && job.Date_Applied !== 'Pending');

    tr.innerHTML = `
      <td class="sl-col">${index + 1}</td>
      <td>
        <a class="job-link" href="${esc(job.Job_Link)}" target="_blank" rel="noopener">
          ${esc(job.Title)}
          ${ICONS.external}
        </a>
      </td>
      <td class="company-cell">${esc(job.Company)}</td>
      <td>${hasHR
        ? `<a class="hr-link" href="${esc(job.HR_Link)}" target="_blank" rel="noopener">${esc(job.HR_Name)}</a>`
        : `<span class="muted">&mdash;</span>`}
      </td>
      <td class="app-type-cell">${
        isEasyApplied
          ? `<span class="pill">${ICONS.pillCheck} Easy Applied</span>`
          : hasExternal
            ? `<a class="ext-btn ext-link" href="${esc(job.External_Job_link)}" target="_blank" rel="noopener" data-job-id="${esc(job.Job_ID)}">${ICONS.external} External Link</a>`
            : `<span class="muted">&mdash;</span>`
      }</td>
      <td class="applied-col">${wasApplied ? ICONS.check : '<span class="dash">&mdash;</span>'}</td>
    `;

    const extLink = tr.querySelector('.ext-link');
    if (extLink) {
      extLink.addEventListener('click', async () => {
        try {
          const res = await fetch(`/applied-jobs/${encodeURIComponent(job.Job_ID)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' }
          });
          if (res.ok) {
            job.Date_Applied = new Date().toISOString();
            const appliedCell = tr.querySelector('.applied-col');
            appliedCell.innerHTML = ICONS.check;
          }
        } catch (err) {
          console.error('Error updating applied date:', err);
        }
      });
    }

    return tr;
  }

  function renderTable() {
    const tbody = document.getElementById('jobsBody');
    tbody.innerHTML = '';
    jobsData.forEach((job, i) => tbody.appendChild(renderRow(job, i)));
  }

  function renderStats() {
    const total = jobsData.length;
    const easy = jobsData.filter(j => j.External_Job_link === 'Easy Applied').length;
    const external = total - easy;
    const companies = new Set(jobsData.map(j => j.Company)).size;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statEasy').textContent = easy;
    document.getElementById('statExternal').textContent = external;
    document.getElementById('statCompanies').textContent = companies;
    document.getElementById('subtitle').textContent =
      total === 0 ? 'No applications recorded yet' : `${total} application${total === 1 ? '' : 's'} tracked`;
  }

  function sortByAppType() {
    sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
    const btn = document.getElementById('sortBtn');
    btn.dataset.order = sortOrder;

    jobsData.sort((a, b) => {
      const va = a.External_Job_link || '';
      const vb = b.External_Job_link || '';
      return sortOrder === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    });
    renderTable();
  }

  document.getElementById('sortBtn').addEventListener('click', sortByAppType);

  async function loadJobs() {
    const refreshBtn = document.getElementById('refreshBtn');
    refreshBtn.classList.add('spinning');
    const tableShell = document.querySelector('.table-shell');
    const emptyState = document.getElementById('emptyState');
    const statRow = document.getElementById('statRow');
    const tableScroll = document.querySelector('.table-scroll');

    try {
      const res = await fetch('/applied-jobs');
      if (res.status === 404) {
        jobsData = [];
      } else if (!res.ok) {
        throw new Error(`Server responded ${res.status}`);
      } else {
        jobsData = await res.json();
      }

      statRow.hidden = false;
      renderStats();

      if (jobsData.length === 0) {
        tableScroll.hidden = true;
        emptyState.hidden = false;
      } else {
        tableScroll.hidden = false;
        emptyState.hidden = true;
        renderTable();
      }
    } catch (err) {
      console.error('Error loading applied jobs:', err);
      statRow.hidden = true;
      tableScroll.hidden = true;
      emptyState.hidden = false;
      document.getElementById('emptyTitle').textContent = 'Could not load applications';
      document.getElementById('emptyHint').textContent = 'Check that the server is running, then hit refresh.';
    } finally {
      refreshBtn.classList.remove('spinning');
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', loadJobs);
  loadJobs();
</script>
</body>
</html>
